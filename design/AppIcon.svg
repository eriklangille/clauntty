  <rect x="49" y="49" width="926" height="926" rx="235" fill="#000" filter="url(#grain)" opacity=".16"/>
  <rect x="51" y="51" width="922" height="922" rx="233" fill="none" stroke="#000" stroke-width="4" opacity=".85"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="none" stroke="#000" stroke-width="8" opacity=".8"/>

  <!-- Screen -->
  <g clip-path="url(#screenClip)">
    <rect x="104" y="104" width="816" height="816" fill="url(#screen)"/>
    <rect x="104" y="104" width="816" height="816" fill="url(#dots)" mask="url(#dotFade)"/>
    <rect x="104" y="104" width="816" height="816" fill="url(#softDots)" mask="url(#softDotFade)"/>
    <rect x="104" y="104" width="816" height="816" fill="url(#vignette)"/>

    <!-- Star: glow around it, lit dots in it, a bright outline -->
    <g fill="none" stroke-linejoin="round">
      <use href="#star" stroke="#ff7410" stroke-width="44" opacity=".7" filter="url(#blur28)"/>
      <use href="#star" stroke="#ffa030" stroke-width="20" filter="url(#blur10)"/>
    </g>
    <use href="#star" fill="url(#starFill)"/>
    <g clip-path="url(#starClip)">
      <use href="#star" fill="url(#litDots)"/>
      <use href="#star" fill="none" stroke="#ffc35a" stroke-width="22" opacity=".7" filter="url(#blur10)"/>
    </g>
    <!-- The glow lights the LED dots near the outline, inside and out -->
    <g mask="url(#glowDots)" fill="none" stroke-linejoin="round">
      <use href="#star" stroke="#ffc457" stroke-width="34" opacity=".6" filter="url(#blur10)"/>
      <use href="#star" stroke="#ffe08a" stroke-width="18" opacity=".7" filter="url(#blur3)"/>
    </g>
    <g fill="none" stroke-linejoin="round">
      <use href="#star" stroke="#ffd060" stroke-width="18" filter="url(#blur3)"/>
      <use href="#star" stroke="#fff6c4" stroke-width="8"/>
    </g>

    <!-- >_ prompt, dark with a light rim -->
    <g fill="none">
      <g stroke="#ffbd45" stroke-width="34" filter="url(#blur3)"><path d="M283,321 L319,341.5 L283,362" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="369" y1="341.5" x2="421" y2="341.5" stroke-linecap="round"/></g>
      <g stroke="#ffeea0" stroke-width="25"><path d="M283,321 L319,341.5 L283,362" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="369" y1="341.5" x2="421" y2="341.5" stroke-linecap="round"/></g>
      <g stroke="#5e220a" stroke-width="16"><path d="M283,321 L319,341.5 L283,362" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="369" y1="341.5" x2="421" y2="341.5" stroke-linecap="round"/></g>
    </g>

    <!-- Glass: a reflection over the top, ending in a soft curve -->
    <path d="M104,104 H920 V352 Q512,520 104,372 Z" fill="url(#gloss)"/>
    <path d="M920,352 Q512,520 104,372" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="3" filter="url(#blur3)"/>

    <!-- Shade where the screen meets the bezel -->
    <rect x="104" y="104" width="816" height="816" rx="182" fill="none" stroke="#000" stroke-width="20" opacity=".4" filter="url(#blur14)"/>
    <!-- Light caught along the top edge of the glass -->
    <rect x="104" y="104" width="816" height="816" rx="182" fill="none" stroke="url(#rim)" stroke-width="16" filter="url(#blur10)"/>
  </g>
</svg>
